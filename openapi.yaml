openapi: 3.1.0
info:
  title: Weather API (circlekit example)
  version: 1.0.0
  description: >-
    The example endpoint from the Quickstart: one route that charges $0.01 per
    request with x402, using circlekit and Circle Gateway on Arc Testnet. Run
    `server.py` from the Quickstart to serve it at http://localhost:8000.
servers:
  - url: http://localhost:8000
    description: Your local server from the Quickstart
tags:
  - name: Forecast
    description: A paid endpoint protected by x402.
paths:
  /forecast:
    get:
      operationId: getForecast
      tags: [Forecast]
      summary: Get the forecast (paid)
      description: >-
        Costs $0.01 in USDC. Without a valid `PAYMENT-SIGNATURE` header the
        server answers `402` with the payment requirements. With a valid
        signature it asks Circle Gateway to verify and settle the payment, then
        answers `200`.
      parameters:
        - name: PAYMENT-SIGNATURE
          in: header
          required: false
          description: >-
            Base64-encoded x402 payment payload signed by the buyer. Build it
            with `GatewayClient.pay()` or `circlekit.x402.create_payment_header`.
          schema:
            type: string
      responses:
        '200':
          description: Payment settled. The body is the paid content.
          headers:
            PAYMENT-RESPONSE:
              description: Base64-encoded settlement receipt.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  forecast:
                    type: string
                    example: sunny
                  paid_by:
                    type: string
                    description: The buyer's wallet address.
                    example: '0x1111111111111111111111111111111111111111'
        '402':
          description: >-
            Payment required, or the payment was rejected. With no payment the
            body lists the accepted payment options. With a rejected payment
            the body has an `error` field instead.
          headers:
            PAYMENT-REQUIRED:
              description: >-
                Base64-encoded copy of the payment requirements. Present when no
                payment was sent. Decode it with
                `circlekit.x402.decode_payment_required`.
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PaymentRequired'
                  - $ref: '#/components/schemas/PaymentError'
components:
  schemas:
    PaymentRequired:
      type: object
      properties:
        x402Version:
          type: integer
          example: 2
        resource:
          type: object
          properties:
            url:
              type: string
              example: /forecast
            description:
              type: string
              example: Weather API
            mimeType:
              type: string
              example: application/json
        accepts:
          type: array
          items:
            $ref: '#/components/schemas/PaymentOption'
    PaymentOption:
      type: object
      properties:
        scheme:
          type: string
          example: exact
        network:
          type: string
          description: CAIP-2 chain ID. `eip155:5042002` is Arc Testnet.
          example: eip155:5042002
        asset:
          type: string
          description: USDC token address on that network.
          example: '0x3600000000000000000000000000000000000000'
        amount:
          type: string
          description: Price in USDC base units (6 decimals). `10000` is $0.01.
          example: '10000'
        payTo:
          type: string
          description: The seller's wallet (`SELLER_ADDRESS`).
        maxTimeoutSeconds:
          type: integer
          description: How long the buyer's signed authorization stays valid.
          example: 604900
        extra:
          type: object
          properties:
            name:
              type: string
              example: GatewayWalletBatched
            version:
              type: string
              example: '1'
            verifyingContract:
              type: string
              example: '0x0077777d7EBA4688BDeF3E311b846F25870A19B9'
    PaymentError:
      type: object
      properties:
        error:
          type: string
          example: Payment verification failed
        reason:
          type: string
          description: Circle Gateway's reason when verification fails.
          example: self_transfer
